{% extends "base.html" %}
{% block title %}Excel Explorer{% endblock %}
{% block content %}
<div class="flex h-full min-h-0 flex-col lg:flex-row">
  <aside class="flex max-h-[55vh] min-h-0 w-full flex-col border-b border-stone-200 bg-white lg:max-h-none lg:w-[23rem] lg:border-b-0 lg:border-r dark:border-zinc-800 dark:bg-zinc-900">
    <form id="upload-form" class="space-y-3 border-b border-stone-200 p-4 dark:border-zinc-800"
          action="/upload" method="post" enctype="multipart/form-data"
          hx-post="/upload" hx-target="#stage" hx-swap="innerHTML" hx-encoding="multipart/form-data"
          hx-indicator="#uploading" hx-disabled-elt="find button">
      <h2 class="text-sm font-semibold" data-i18n="upload_title">Nạp file</h2>
      <label class="block text-xs text-stone-500 dark:text-zinc-400">
        <span data-i18n="file_label">File Excel</span>
        <input id="excel-file" class="mt-1 block w-full text-sm file:mr-3 file:rounded-md file:border-0 file:bg-green-800 file:px-3 file:py-1.5 file:text-sm file:text-white" type="file" name="file" accept=".xlsx,.xls" required
               hx-post="/upload/preview" hx-trigger="change" hx-target="#stage" hx-swap="innerHTML"
               hx-encoding="multipart/form-data" hx-indicator="#previewing">
      </label>
      <label class="block text-xs text-stone-500 dark:text-zinc-400">
        <span data-i18n="header_label">Dòng tiêu đề</span>
        <input class="mt-1 w-24 rounded-md border border-stone-300 bg-white px-2 py-1.5 text-sm text-stone-900 dark:border-zinc-700 dark:bg-zinc-950 dark:text-zinc-100" type="number" name="header_row" min="1" max="100" value="1">
      </label>
      <p class="text-xs text-stone-500 dark:text-zinc-400" data-i18n="header_help">Dùng khi nạp ngay, chưa xem trước. Mặc định là dòng 1.</p>
      <div class="flex flex-wrap gap-2">
        <button type="submit" class="rounded-md bg-green-800 px-3 py-1.5 text-sm font-medium text-white hover:bg-green-900">
          <span data-i18n="convert_btn">Nạp ngay</span>
        </button>
        <button type="button" class="rounded-md border border-stone-300 px-3 py-1.5 text-sm dark:border-zinc-600"
                hx-post="/upload/preview" hx-target="#stage" hx-swap="innerHTML"
                hx-encoding="multipart/form-data" hx-indicator="#previewing" hx-validate="true">
          <span data-i18n="preview_btn">Xem 10 dòng đầu</span>
        </button>
        <span id="uploading" class="htmx-indicator text-xs text-green-900 dark:text-green-300" data-i18n="uploading">Đang nạp…</span>
        <span id="previewing" class="htmx-indicator text-xs text-green-900 dark:text-green-300" data-i18n="loading">Đang đọc…</span>
      </div>
    </form>
    <div id="preview-panel" class="max-h-72 overflow-auto border-b border-stone-200 dark:border-zinc-800"></div>
    <div id="library" class="min-h-0 flex-1 overflow-auto p-4">
      {% include "partials/library.html" %}
    </div>
  </aside>
  <section class="min-h-0 flex-1 overflow-auto">
    <div id="stage" class="h-full">
      {% include "partials/home_stage.html" %}
    </div>
  </section>
</div>
{% endblock %}
