<!DOCTYPE html>
<html lang="vi" class="h-full" x-data="shell()" x-init="init()" :class="{ dark: dark }">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Excel Explorer{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <script>
    (function () {
      var theme = localStorage.getItem("theme");
      var dark = theme ? theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.classList.add("dark");
      document.documentElement.lang = localStorage.getItem("lang") || "vi";
    })();
  </script>
  <script src="/static/vendor/tailwind.js"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body class="h-full bg-stone-100 text-stone-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
  <div class="flex h-full min-h-0 flex-col">
    <header class="flex items-center justify-between gap-4 border-b border-stone-200 bg-white px-4 py-3 dark:border-zinc-800 dark:bg-zinc-900">
      <div class="flex items-center gap-3">
        <img src="/static/favicon.ico" alt="" class="h-9 w-9 rounded-lg" width="36" height="36">
        <div>
          <a href="/" class="text-base font-semibold tracking-tight">Excel Explorer</a>
          <p class="text-xs text-stone-500 dark:text-zinc-400" data-i18n="tagline">Đọc Excel lớn ngay trên máy</p>
        </div>
        <nav class="ml-2 flex gap-3 text-sm">
          <a class="text-green-900 dark:text-green-400" href="/" data-i18n="nav_library">Thư viện</a>
          <a class="text-green-900 dark:text-green-400" href="/raw" data-i18n="nav_raw">Raw</a>
          <a class="text-green-900 dark:text-green-400" href="/mappings" data-i18n="nav_map">Mapping</a>
        </nav>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex rounded-md border border-stone-200 p-0.5 text-xs dark:border-zinc-700">
          <button type="button" class="rounded px-2 py-1" :class="lang === 'vi' ? 'bg-green-800 text-white' : ''" @click="setLang('vi')">VI</button>
          <button type="button" class="rounded px-2 py-1" :class="lang === 'en' ? 'bg-green-800 text-white' : ''" @click="setLang('en')">EN</button>
        </div>
        <button type="button" class="rounded-md border border-stone-200 px-3 py-1.5 text-sm dark:border-zinc-700" @click="toggleTheme()" x-text="dark ? t('theme_light') : t('theme_dark')">Tối</button>
      </div>
    </header>
    <main class="min-h-0 flex-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-stone-200 px-4 py-2 text-xs text-stone-500 dark:border-zinc-800 dark:text-zinc-500">
      <span data-i18n="footer_local">Chạy trên máy này, không gửi dữ liệu đi đâu.</span>
    </footer>
  </div>
  <script src="/static/js/i18n.js?v=16"></script>
  <script src="/static/js/app.js?v=7"></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
</body>
</html>
