<div class="overflow-x-auto rounded border border-stone-200 bg-white dark:border-zinc-700 dark:bg-zinc-900">
  <p class="px-3 py-2 text-sm font-medium"><span data-i18n="map_sum">Tính tổng</span> · {{ column }}</p>
  <table class="min-w-full text-sm">
    <thead>
      <tr>
        <th class="px-3 py-1 text-left text-xs" data-i18n="map_sum_source">Tháng</th>
        <th class="px-3 py-1 text-right text-xs">{{ column }}</th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <td class="px-3 py-1" title="{{ row.name }}">{{ row.label }} <span class="text-stone-500">/ {{ row.sheet }}</span></td>
        <td class="px-3 py-1 text-right tabular-nums">{% if row.missing %}<span class="text-yellow-700 dark:text-yellow-300" data-i18n="map_sum_missing">Chưa nối</span>{% else %}{{ row.text }}{% endif %}</td>
      </tr>
      {% endfor %}
      <tr class="border-t border-stone-200 font-semibold dark:border-zinc-700">
        <td class="px-3 py-1" data-i18n="map_sum_total">Tổng cộng</td>
        <td class="px-3 py-1 text-right tabular-nums">{{ grand }}</td>
      </tr>
    </tbody>
  </table>
</div>
